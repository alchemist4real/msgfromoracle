<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Msg from Oracle — The Prophecy Machine</title>
    <meta name="description" content="Ask the Oracle a question. Receive a prophecy you never asked for.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' fill='none' stroke='%23fff' stroke-width='2'%3E%3Ccircle cx='20' cy='20' r='18'/%3E%3Cpath d='M20 8 L20 14 M20 26 L20 32 M8 20 L14 20 M26 20 L32 20' stroke-width='1.5'/%3E%3Ccircle cx='20' cy='20' r='4' fill='%23fff'/%3E%3C/svg%3E">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0a;
            --bg-card: #111111;
            --bg-elevated: #181818;
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --text: #f5f5f5;
            --text-dim: rgba(255,255,255,0.5);
            --text-muted: rgba(255,255,255,0.25);
            --accent: #f5f5f5;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .serif { font-family: 'Playfair Display', Georgia, serif; }

        /* ── Screens ── */
        .screen { width: 100%; max-width: 440px; margin: 0 auto; }
        .screen.hidden { display: none; }

        /* ── Animations ── */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }

        .fade-up { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .fade-in { animation: fadeIn 0.6s ease forwards; }

        /* ── Landing ── */
        .landing-header { text-align: center; margin-bottom: 48px; }
        .landing-header h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            letter-spacing: -0.03em;
            line-height: 1;
            margin-bottom: 12px;
        }
        .landing-header p {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-dim);
            letter-spacing: 0.02em;
        }

        /* ── Form ── */
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
        }

        .input-group { margin-bottom: 20px; }
        .input-group:last-of-type { margin-bottom: 28px; }

        .input-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            padding: 14px 18px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }
        .input-field::placeholder { color: var(--text-muted); }
        .input-field:focus {
            border-color: var(--border-hover);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.03);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--bg);
            background: var(--text);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .submit-btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .submit-btn:active { transform: translateY(0); opacity: 0.9; }

        /* ── Loading ── */
        .loading-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }

        .oracle-eye {
            width: 80px; height: 80px;
            position: relative;
            margin-bottom: 32px;
        }
        .oracle-eye .ring {
            position: absolute; inset: 0;
            border: 2px solid var(--border);
            border-top-color: var(--text);
            border-radius: 50%;
            animation: orbit 2s linear infinite;
        }
        .oracle-eye .ring:nth-child(2) {
            inset: 12px;
            animation-duration: 3s;
            animation-direction: reverse;
            border-top-color: var(--text-dim);
        }
        .oracle-eye .core {
            position: absolute;
            inset: 28px;
            background: var(--text);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        .loading-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dim);
            letter-spacing: 0.04em;
            animation: pulse 2s ease-in-out infinite;
        }

        /* ── Result Card ── */
        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
        }

        .result-image-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            overflow: hidden;
            background: var(--bg);
        }
        .result-image-wrap img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .result-card:hover .result-image-wrap img { transform: scale(1.03); }

        .result-image-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent 40%, var(--bg-card));
            pointer-events: none;
        }

        .result-body { padding: 28px 28px 24px; }

        .result-meta {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .result-title {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: clamp(1.5rem, 5vw, 2rem);
            line-height: 1.15;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }

        .result-prophecy {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 15px;
            line-height: 1.7;
            color: var(--text-dim);
            padding: 20px;
            background: var(--bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            position: relative;
        }
        .result-prophecy::before {
            content: '\201C';
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-style: normal;
            position: absolute;
            top: 6px; left: 14px;
            color: var(--text-muted);
            line-height: 1;
        }

        .result-footer {
            padding: 16px 28px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .result-footer-credit {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
        }
        .result-footer-badge {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            padding: 4px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        /* ── Action buttons ── */
        .actions { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }

        .btn-primary {
            width: 100%;
            padding: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--bg);
            background: var(--text);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary:hover { opacity: 0.85; }

        .btn-ghost {
            width: 100%;
            padding: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-ghost:hover { border-color: var(--border-hover); color: var(--text); }

        /* ── Footer ── */
        .page-footer {
            text-align: center;
            margin-top: 32px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            body { padding: 16px; }
            .form-card { padding: 24px; }
            .result-body { padding: 24px 20px 20px; }
            .result-footer { padding: 14px 20px 16px; }
        }

        /* ── Audio visualizer bar ── */
        .audio-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 20px;
            margin-top: 12px;
        }
        .audio-bar .bar {
            width: 3px;
            height: 4px;
            background: var(--text-dim);
            border-radius: 2px;
            animation: barPulse 0.8s ease-in-out infinite;
        }
        .audio-bar .bar:nth-child(1) { animation-delay: 0s; }
        .audio-bar .bar:nth-child(2) { animation-delay: 0.15s; }
        .audio-bar .bar:nth-child(3) { animation-delay: 0.3s; }
        .audio-bar .bar:nth-child(4) { animation-delay: 0.45s; }
        .audio-bar .bar:nth-child(5) { animation-delay: 0.6s; }
        @keyframes barPulse {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }

        .audio-playing .bar { background: var(--text); }
    </style>
</head>
<body>

    <div id="app" style="width: 100%; max-width: 440px; margin: 0 auto;">

        <!-- ━━━ INPUT SCREEN ━━━ -->
        <div id="input-screen" class="screen fade-up">
            <div class="landing-header">
                <h1 class="serif">Msg from<br>Oracle</h1>
                <p>The prophecy you never asked for.</p>
            </div>

            <div class="form-card">
                <div class="input-group">
                    <label class="input-label" for="name-input">Your Name</label>
                    <input type="text" id="name-input" class="input-field" placeholder="What shall the Oracle call you?" autocomplete="off">
                </div>
                <div class="input-group">
                    <label class="input-label" for="aspiration-input">Your Deepest Wish</label>
                    <input type="text" id="aspiration-input" class="input-field" placeholder="What do you secretly hope for?" autocomplete="off">
                </div>
                <button id="draw-card-btn" class="submit-btn">Summon the Oracle</button>
            </div>

            <div class="page-footer">by alchemist4real</div>
        </div>

        <!-- ━━━ LOADING SCREEN ━━━ -->
        <div id="loading-screen" class="screen hidden fade-in">
            <div class="loading-container">
                <div class="oracle-eye">
                    <div class="ring"></div>
                    <div class="ring"></div>
                    <div class="core"></div>
                </div>
                <p id="loading-text" class="loading-text">Reaching beyond the veil...</p>
                <div id="audio-visualizer" class="audio-bar" style="display:none;">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>
            </div>
        </div>

        <!-- ━━━ RESULT SCREEN ━━━ -->
        <div id="result-screen" class="screen hidden fade-up">
            <div id="shareable-card" class="result-card">
                <div class="result-image-wrap">
                    <img id="card-image" src="" alt="Oracle Vision">
                    <div class="result-image-overlay"></div>
                </div>
                <div class="result-body">
                    <p class="result-meta">
                        Oracle speaks to <strong id="user-name-display"></strong>
                        <br><span id="aspiration-display" style="color: var(--text-muted); font-style: italic;"></span>
                    </p>
                    <h2 id="card-name" class="result-title serif"></h2>
                    <div id="prophecy-text" class="result-prophecy"></div>
                </div>
                <div class="result-footer">
                    <span class="result-footer-credit">by alchemist4real</span>
                    <span class="result-footer-badge">Msg from Oracle</span>
                </div>
            </div>

            <div class="actions">
                <button id="download-btn" class="btn-primary">Save Prophecy</button>
                <button id="reset-btn" class="btn-ghost">Ask Again</button>
            </div>

            <div id="result-audio-bar" class="audio-bar audio-playing" style="display:none; margin-top: 16px;">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
        </div>
    </div>

    <audio id="tts-audio" style="display: none;"></audio>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const E = id => document.getElementById(id);
        const el = {
            inputScreen: E('input-screen'), loadingScreen: E('loading-screen'),
            resultScreen: E('result-screen'), nameInput: E('name-input'),
            aspirationInput: E('aspiration-input'), drawCardBtn: E('draw-card-btn'),
            resetBtn: E('reset-btn'), downloadBtn: E('download-btn'), loadingText: E('loading-text'),
            cardImage: E('card-image'), cardName: E('card-name'), prophecyText: E('prophecy-text'),
            userNameDisplay: E('user-name-display'), aspirationDisplay: E('aspiration-display'),
            ttsAudio: E('tts-audio'), audioViz: E('audio-visualizer'), resultAudioBar: E('result-audio-bar'),
        };

        // ── API helper ──
        async function api(type, payload) {
            const res = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, payload })
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(`API ${type} failed: ${res.status} ${JSON.stringify(err)}`);
            }
            return res.json();
        }

        // ── Audio ──
        function playAudio(src) {
            return new Promise(resolve => {
                if (!src) { resolve(); return; }
                el.ttsAudio.src = src;
                el.ttsAudio.onended = resolve;
                el.ttsAudio.onerror = () => { console.error('Audio error'); resolve(); };
                el.ttsAudio.play().catch(() => resolve());
            });
        }

        function makeWavUrl(b64, mime) {
            const rate = parseInt(mime.match(/rate=(\d+)/)[1], 10);
            const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
            const pcm = new Int16Array(raw.buffer);
            const buf = new ArrayBuffer(44 + pcm.length * 2);
            const v = new DataView(buf);
            // RIFF header
            v.setUint32(0, 0x52494646, false); v.setUint32(4, 36 + pcm.length * 2, true);
            v.setUint32(8, 0x57415645, false); v.setUint32(12, 0x666d7420, false);
            v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
            v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
            v.setUint16(32, 2, true); v.setUint16(34, 16, true);
            v.setUint32(36, 0x64617461, false); v.setUint32(40, pcm.length * 2, true);
            for (let i = 0; i < pcm.length; i++) v.setInt16(44 + i * 2, pcm[i], true);
            return URL.createObjectURL(new Blob([v], { type: 'audio/wav' }));
        }

        function showScreen(screen) {
            [el.inputScreen, el.loadingScreen, el.resultScreen].forEach(s => s.classList.add('hidden'));
            screen.classList.remove('hidden');
        }

        // ── Main flow ──
        async function summonOracle() {
            const name = el.nameInput.value.trim() || 'Nameless Seeker';
            const wish = el.aspirationInput.value.trim() || 'something impossible';

            showScreen(el.loadingScreen);

            try {
                // Step 1: Greeting TTS
                el.loadingText.textContent = 'The Oracle senses your presence...';
                el.audioViz.style.display = 'flex';

                const greetText = `Silence! I sense the trembling of your soul, ${name}. You come seeking '${wish}'. A trivial hope you consider monumental. Very well, I, the Oracle, shall weave words for you. Be still while I think.`;
                const greetData = await api('greeting-tts', { text: greetText });
                await playAudio(greetData.url);
                el.audioViz.style.display = 'none';

                // Step 2: Generate poem
                el.loadingText.textContent = 'Weaving fate from your desires...';
                const sysPrompt = `You are a Sarcastic Oracle Poet. You are cynical about human hopes but express it through poetry. Create a POEM TITLE (absurd and dramatic), a WRITTEN PROPHECY (poetic, neutral-toned, beautifully crafted, 2-3 sentences), and a SPOKEN WHISPER (very mocking, addresses the user by name, self-praising. 2-3 sentences). RESPOND ONLY IN JSON: {"card_name": "POEM TITLE", "written_interpretation": "WRITTEN PROPHECY", "spoken_interpretation": "SPOKEN WHISPER"}. All text in English. No markdown.`;
                const textPayload = {
                    systemInstruction: { parts: [{ text: sysPrompt }] },
                    contents: [{ parts: [{ text: `Name: ${name}, Wish: ${wish}` }] }]
                };
                const textRaw = await api('text', textPayload);
                const oracle = JSON.parse(textRaw.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim());

                // Step 3: Image + TTS in parallel
                el.loadingText.textContent = 'Conjuring visions and whispers...';
                const ttsPayload = {
                    contents: [{ parts: [{ text: `Speak in a deep, poetic, slightly mocking English voice: ${oracle.spoken_interpretation}` }] }],
                    generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: 'Algenib' } } } }
                };

                const ttsData = await api('tts', ttsPayload);
                const imgPrompt = `A hauntingly beautiful abstract artwork for a poem titled "${oracle.card_name}". Ethereal, minimal, dark void with subtle light, cinematic atmosphere, moody, fine art photography style, black and white with subtle warm tones, dramatic lighting.`;
                const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(imgPrompt)}?width=800&height=600&nologo=true`;
                const ttsPart = ttsData?.candidates?.[0]?.content?.parts?.[0];
                const whisperUrl = ttsPart ? makeWavUrl(ttsPart.inlineData.data, ttsPart.inlineData.mimeType) : null;

                // Populate result
                el.cardName.textContent = oracle.card_name;
                el.prophecyText.textContent = oracle.written_interpretation;
                el.userNameDisplay.textContent = name;
                el.aspirationDisplay.textContent = `"${wish}"`;
                el.cardImage.src = imgUrl;

                await new Promise(resolve => {
                    el.cardImage.onload = resolve;
                    el.cardImage.onerror = () => {
                        el.cardImage.src = `https://placehold.co/800x600/0a0a0a/333333?text=${encodeURIComponent(oracle.card_name)}`;
                        resolve();
                    };
                });

                showScreen(el.resultScreen);

                // Play the spoken whisper
                if (whisperUrl) {
                    el.resultAudioBar.style.display = 'flex';
                    await playAudio(whisperUrl);
                    el.resultAudioBar.style.display = 'none';
                }

            } catch (err) {
                console.error('Oracle error:', err);
                el.audioViz.style.display = 'none';
                el.loadingText.textContent = 'The veil resists. Try again shortly.';
                setTimeout(() => showScreen(el.inputScreen), 3000);
            }
        }

        // ── Download ──
        function downloadResult() {
            html2canvas(E('shareable-card'), {
                backgroundColor: '#0a0a0a', useCORS: true, scale: 2
            }).then(canvas => {
                const a = document.createElement('a');
                const safeName = (el.nameInput.value.trim() || 'seeker').replace(/[^a-z0-9]/gi, '_').toLowerCase();
                a.download = `oracle_${safeName}_${Date.now()}.png`;
                a.href = canvas.toDataURL('image/png');
                a.click();
            }).catch(err => console.error('Download failed:', err));
        }

        // ── Reset ──
        function resetApp() {
            showScreen(el.inputScreen);
            el.nameInput.value = '';
            el.aspirationInput.value = '';
            el.ttsAudio.pause();
            el.resultAudioBar.style.display = 'none';
        }

        // ── Events ──
        el.drawCardBtn.addEventListener('click', summonOracle);
        el.resetBtn.addEventListener('click', resetApp);
        el.downloadBtn.addEventListener('click', downloadResult);

        // Enter key support
        el.nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') el.aspirationInput.focus(); });
        el.aspirationInput.addEventListener('keydown', e => { if (e.key === 'Enter') summonOracle(); });
    });
    </script>
</body>
</html>
